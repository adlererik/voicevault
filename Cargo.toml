[workspace]
members = ["crates/*"]
exclude = ["fuzz", "platform", "vendor/opus-rs", "vendor/snow", "vendor/libcrux-platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
call-state = { path = "crates/call-state", default-features = false }
protocol = { path = "crates/protocol", default-features = false }
codec = { path = "crates/codec", default-features = false }
link = { path = "crates/link", default-features = false }
device-core = { path = "crates/device-core", default-features = false }
snow = { version = "=0.10.0", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "hfs"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
curve25519-dalek = { version = "=4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
getrandom = "=0.4.3"
libcrux-ml-kem = { version = "=0.0.11", default-features = false, features = ["mlkem768"] }
opus-rs = { version = "=0.1.41", default-features = false, features = ["libm"] }
blake2 = { version = "=0.10.6", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false }
libm = "0.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
libc = "=0.2.189"
proptest = "1"
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[patch.crates-io]
libcrux-platform = { path = "vendor/libcrux-platform" }
snow = { path = "vendor/snow" }
opus-rs = { path = "vendor/opus-rs" }
