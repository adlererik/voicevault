[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
call-state = { path = "crates/call-state" }
protocol = { path = "crates/protocol" }
codec = { path = "crates/codec" }
link = { path = "crates/link" }
device-core = { path = "crates/device-core" }
snow = { version = "=0.10.0", default-features = false, features = ["std", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom"] }
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
getrandom = "=0.4.3"
opus-rs = "=0.1.41"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
libc = "=0.2.189"
proptest = "1"
zeroize = "1"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
