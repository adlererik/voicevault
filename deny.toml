[advisories]
db-path = ".lab-cache/advisory-db"
git-fetch-with-cli = true

[licenses]
confidence-threshold = 0.8
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0"]

[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["NCSA"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
