[package]
name = "quietlink-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
link = { path = "../crates/link" }
libfuzzer-sys = "=0.4.13"
protocol = { path = "../crates/protocol" }
device-core = { path = "../crates/device-core" }
codec = { path = "../crates/codec" }
ed25519-dalek = "=2.2.0"

[patch.crates-io]
libcrux-platform = { path = "../vendor/libcrux-platform" }
snow = { path = "../vendor/snow" }
opus-rs = { path = "../vendor/opus-rs" }

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

